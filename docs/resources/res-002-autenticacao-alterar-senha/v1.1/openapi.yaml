openapi: 3.1.0
info:
  title: MVP Pastoral da Juventude - RES-002 Alterar senha
  version: 1.1.0
paths:
  /api/v1/autenticacao/alterar-senha:
    post:
      operationId: alterarSenha
      summary: Alterar senha
      description: >
        Permite troca obrigatória com token TROCA_SENHA ou troca voluntária
        com sessão normal. Após sucesso, exige novo login.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        x-max-body-size: 1048576
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
      responses:
        '204':
          description: Senha alterada com sucesso
          headers:
            X-Correlation-Id:
              required: true
              schema:
                type: string
                format: uuid
            Set-Cookie:
              required: false
              description: >
                No fluxo voluntário pode ser usado para expirar o cookie refresh_token.
              schema:
                type: string
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Token, sessão ou credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Usuário inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '413':
          description: Request body excede o limite global de 1 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '503':
          description: Serviço indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Pode ser Access Token de sessão normal ou token restrito TROCA_SENHA,
        conforme o fluxo.
  schemas:
    AlterarSenhaRequest:
      type: object
      additionalProperties: false
      required: [novaSenha, confirmacaoNovaSenha]
      properties:
        senhaAtual:
          type: string
          minLength: 1
          maxLength: 128
          description: Obrigatória apenas no fluxo voluntário.
        novaSenha:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[^\s]+$'
        confirmacaoNovaSenha:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[^\s]+$'
    ErroCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensagem]
      properties:
        campo:
          type: string
        codigo:
          type: string
        mensagem:
          type: string
    ErroResponse:
      type: object
      additionalProperties: false
      required: [timestamp, status, codigo, titulo, mensagem, endpoint, correlationId]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        codigo:
          type: string
        titulo:
          type: string
        mensagem:
          type: string
        endpoint:
          type: string
        correlationId:
          type: string
          format: uuid
        erros:
          type: array
          items:
            $ref: '#/components/schemas/ErroCampo'
